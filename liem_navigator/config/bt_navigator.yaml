    # default_nav_through_poses_bt_xml: "/home/liemtran/liem_ws/src/liem_navigator/behavior_tree/test_bt.xml"
    default_nav_to_pose_bt_xml:       "/home/liemtran/liem_ws/src/liem_navigator/behavior_tree/liem_bt_navigator.xml"
    default_nav_through_poses_bt_xml: "/home/liemtran/liem_ws/src/liem_navigator/behavior_tree/liem_bt_navigator.xml"


    