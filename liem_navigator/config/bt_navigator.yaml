bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: "map"
    robot_base_frame: "base_link"
    odom_topic: "differential_drive_controller/odom"
    transform_tolerance: 0.3
    default_server_timeout: 1000  # 1s
    bt_loop_duration: 10   # 10ms per tick
    wait_for_service_timeout: 1000 # 1s
